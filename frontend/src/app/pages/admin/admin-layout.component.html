<div class="admin-layout">
  <aside class="admin-layout__sidebar">
    <h2 class="admin-layout__title">Panel de administración</h2>
    <nav class="admin-layout__nav" aria-label="Secciones de administración">
      @for (item of navItems; track item.route) {
        <a
          class="admin-layout__nav-item"
          [routerLink]="item.route"
          routerLinkActive="admin-layout__nav-item--active"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <nav class="admin-layout__mobile-nav" aria-label="Secciones de administración">
    @for (item of navItems; track item.route) {
      <a
        class="admin-layout__mobile-nav-item"
        [routerLink]="item.route"
        routerLinkActive="admin-layout__mobile-nav-item--active"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <main class="admin-layout__content">
    <router-outlet />
  </main>
</div>
