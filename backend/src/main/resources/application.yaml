spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/turnero
    username: turnero_user
    password: turnero_pass

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Argentina/Buenos_Aires

  flyway:
    enabled: true

  # Transactional email (SMTP). All values come from environment variables: blank defaults
  # mean "not configured" for local dev, where SmtpEmailSender logs and skips instead of
  # failing. In production every MAIL_* var is required (see README env-var table).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Bounded SMTP timeouts: a send runs on a dedicated async thread, and without these a
          # stalled mail server would block that thread indefinitely (invisible, since failures
          # never propagate). 10s to open the connection, 15s to read server responses, 10s to
          # write the message body.
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 10000

clinic:
  max-concurrent-appointments: 2
  min-cancellation-hours: 24

app:
  # Public URL of the Angular frontend, used to build the links embedded in emails.
  base-url: ${APP_BASE_URL:http://localhost:4200}
  # Google OAuth2 login (Google Login button). Credentials come from GOOGLE_CLIENT_ID /
  # GOOGLE_CLIENT_SECRET and the feature is off by default: it only activates when
  # GOOGLE_OAUTH_ENABLED=true (and the app fails fast if the credentials are missing then).
  # This keeps local dev and the test suite bootable without Google configuration.
  oauth2:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:eQi – Especialidades Kinésicas}
  tokens:
    # One-time token lifetimes (ISO-8601 durations). Password reset is deliberately shorter
    # because it grants account access; email verification is more lenient.
    email-verification-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
    password-reset-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT1H}
    # Minimum time between two emails of the same kind (verification resend / password reset) for
    # the same user. Protects the transactional-email quota on the provider from being burned by
    # automated calls to the public resend/forgot endpoints. The response stays 200 either way.
    resend-cooldown: ${RESEND_COOLDOWN:PT60S}

jwt:
  # Dev-only fallback so a local `./mvnw spring-boot:run` works without extra setup. In any
  # non-dev profile this MUST be overridden via the JWT_SECRET env var - see SecurityConfig /
  # JwtService, which fail fast rather than silently signing tokens with a guessable secret.
  secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-min-32-bytes}
  expiration-ms: 86400000

admin:
  # Bootstrap admin credentials. Outside the dev profile these have no default: the app refuses
  # to start rather than risk a known admin password reaching production. See AdminBootstrapRunner.
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

cors:
  # Comma-separated list of origins allowed to call the API from a browser. Defaults to the
  # Angular dev server; override via CORS_ALLOWED_ORIGINS in staging/production.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}